<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ถึงน้อง Chertam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one phone-width column (jar with a little face, the note it gives you) and a candy button pinned to the bottom for the thumb.
     Single pastel theme on purpose: the page keeps its sweet look in light and dark system settings. */
  :root {
    --bg: #FFF1F5;
    --dots: #FFDCE6;
    --card: #FFFFFF;
    --ink: #5B3A4B;
    --muted: #8F6A7C;
    --pink: #E8578A;
    --pink-deep: #C23E6E;
    --pink-soft: #FFB8CC;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-line: #F4A9BE;
    --blush: #FF9DB8;
    --p1: #FFD66B;
    --p2: #FF9EBB;
    --p3: #8EDCC0;
    --p4: #BBA8F5;
    --p5: #FFB27A;
    --p6: #8CCBFF;
    --sky-top: #F3E1FF;
    --grass: #CDEFD6;
    --leaf: #7CC796;
    --font-display: "Itim", "Mali", "Comic Sans MS", cursive;
    --font-body: "Mali", "Thonburi", "Leelawadee UI", system-ui, sans-serif;
    color-scheme: light;
  }

  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(var(--dots) 18%, transparent 19%),
      radial-gradient(var(--dots) 18%, transparent 19%),
      linear-gradient(to bottom, var(--sky-top), transparent 30rem);
    background-size: 2.4rem 2.4rem, 2.4rem 2.4rem, 100% 30rem;
    background-position: 0 0, 1.2rem 1.2rem, 0 0;
    background-repeat: repeat, repeat, no-repeat;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.7;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  .page {
    max-width: 28rem;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 1.75rem calc(6.5rem + env(safe-area-inset-bottom, 0px));
    display: grid;
    gap: 1.5rem;
  }

  header { display: grid; justify-items: center; gap: 0.5rem; text-align: center; }
  .eyebrow {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--pink-deep);
    background: var(--card);
    border: 2px solid var(--pink-soft);
    border-radius: 999px;
    padding: 0.15rem 0.9rem;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.1rem, 10vw, 2.9rem);
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }
  h1 .name { color: var(--pink); }
  .lead { margin: 0; color: var(--muted); max-width: 22rem; }

  /* Jar */
  .jar-area { display: grid; justify-items: center; }
  .jar {
    position: relative;
    width: min(64vw, 15.5rem);
    max-width: 100%;
    aspect-ratio: 200 / 260;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    border-radius: 2rem;
    touch-action: manipulation;
  }
  .jar:focus-visible { outline: 3px dashed var(--pink); outline-offset: 6px; }
  .jar-inner { position: absolute; inset: 0; transform-origin: 50% 90%; }
  .jar.wiggle .jar-inner { animation: wiggle 0.5s ease; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-6deg); }
    50% { transform: rotate(5deg); }
    75% { transform: rotate(-2deg); }
  }
  .jar-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .jar-svg .glass { fill: var(--glass); stroke: var(--glass-line); stroke-width: 3; }
  .jar-svg .shine { fill: none; stroke: var(--card); stroke-width: 6; stroke-linecap: round; }
  .jar-svg .lid { fill: var(--pink-soft); stroke: var(--pink); stroke-width: 2.5; }
  .jar-svg .lid-dot { fill: var(--card); opacity: 0.8; }
  .jar-svg .eye { fill: var(--ink); }
  .jar-svg .smile { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
  .jar-svg .blush { fill: var(--blush); opacity: 0.7; }
  .jar-svg .bow { fill: var(--pink); }
  .pile { position: absolute; inset: 0; }
  .pile .star { position: absolute; width: 18%; height: auto; aspect-ratio: 1; transform: rotate(var(--rot)); }
  .jar-hint { margin-top: 0.4rem; font-size: 0.9rem; color: var(--muted); }

  .star { display: block; color: var(--c, var(--p1)); overflow: visible; filter: drop-shadow(0 2px 0 rgba(194, 62, 110, 0.18)); }

  /* Note */
  .note {
    position: relative;
    background: var(--card);
    border: 3px solid var(--c, var(--pink-soft));
    border-radius: 1.5rem;
    padding: 2rem 1.4rem 1.5rem;
    min-height: 10rem;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 0.6rem;
    text-align: center;
    box-shadow: 0 6px 0 var(--c, var(--pink-soft));
  }
  .note::before {
    content: "";
    position: absolute;
    top: -0.85rem;
    left: 50%;
    width: 5.5rem;
    height: 1.5rem;
    transform: translateX(-50%) rotate(-3deg);
    background: repeating-linear-gradient(45deg, var(--pink-soft) 0 6px, var(--dots) 6px 12px);
    opacity: 0.9;
    border-radius: 3px;
  }
  .note .note-star { width: 3.4rem; height: 3.4rem; transform-origin: 50% 90%; animation: squish 2.2s ease-in-out infinite; }
  @keyframes squish {
    0%, 100% { transform: scale(1, 1); }
    45% { transform: scale(1.06, 0.94); }
    60% { transform: scale(0.96, 1.05) translateY(-3px); }
  }
  .note.pop { animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop {
    from { transform: translateY(-2.5rem) scale(0.4) rotate(-8deg); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .note-text {
    font-family: var(--font-display);
    font-size: clamp(1.3rem, 5.8vw, 1.55rem);
    line-height: 1.55;
    margin: 0;
    text-wrap: pretty;
  }

  footer { display: grid; justify-items: center; gap: 0.1rem; text-align: center; color: var(--muted); }
  footer .sign { font-family: var(--font-display); font-size: 1.3rem; color: var(--pink-deep); }

  /* Thumb dock */
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0.75rem calc(0.9rem + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .dock .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    max-width: 24rem;
    margin: 0 auto;
    font: 700 1.2rem/1 var(--font-body);
    min-height: 3.4rem;
    border-radius: 999px;
    border: 0;
    background: var(--pink);
    color: #FFFFFF;
    box-shadow: 0 5px 0 var(--pink-deep);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .dock .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-deep); }
  .dock .btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }

  /* Decorations */
  .page { position: relative; z-index: 1; }
  .icon { display: block; fill: currentColor; }
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sky .icon {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    color: var(--c);
    opacity: 0.75;
    animation: drift 7s ease-in-out var(--d) infinite alternate;
  }
  @keyframes drift {
    from { transform: translateY(0) rotate(-10deg); }
    to { transform: translateY(-14px) rotate(10deg); }
  }

  .bunting { display: block; width: 100%; max-width: 22rem; height: auto; margin-bottom: 0.25rem; }
  .bunting .string { fill: none; stroke: var(--glass-line); stroke-width: 1.5; }

  .name-wrap { position: relative; display: inline-block; }
  .tw { position: absolute; width: 0.45em; height: 0.45em; color: var(--p1); animation: twinkle 2.4s ease-in-out infinite; }
  .tw1 { top: -0.15em; right: -0.5em; }
  .tw2 { bottom: 0.05em; left: -0.45em; width: 0.3em; height: 0.3em; color: var(--p4); animation-delay: 0.8s; }
  @keyframes twinkle {
    0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.5; }
    50% { transform: scale(1.1) rotate(20deg); opacity: 1; }
  }

  .jar-area { position: relative; }
  .jar-sparkle { position: absolute; color: var(--p1); animation: twinkle 2.6s ease-in-out infinite; pointer-events: none; }
  .js1 { width: 1.6rem; height: 1.6rem; top: 12%; left: calc(50% - min(32vw, 7.75rem) - 1.4rem); }
  .js2 { width: 1.1rem; height: 1.1rem; top: 45%; left: calc(50% + min(32vw, 7.75rem) + 0.4rem); color: var(--p2); animation-delay: 0.9s; }
  .js3 { width: 0.9rem; height: 0.9rem; top: 72%; left: calc(50% - min(32vw, 7.75rem) - 0.6rem); color: var(--p3); animation-delay: 1.6s; }

  .corner { position: absolute; bottom: 0.7rem; width: 1rem; height: 1rem; color: var(--c, var(--pink-soft)); }
  .corner.l { left: 0.8rem; transform: rotate(-15deg); }
  .corner.r { right: 0.8rem; transform: rotate(15deg); }

  .bit {
    position: absolute;
    top: 0.5rem;
    left: 50%;
    width: var(--s);
    height: var(--s);
    margin-left: calc(var(--s) / -2);
    color: var(--c);
    pointer-events: none;
    animation: fly 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }
  @keyframes fly {
    from { transform: translate(0, 0) scale(0.3) rotate(0); opacity: 1; }
    70% { opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--r)); opacity: 0; }
  }

  /* Side decorations: fill the empty space beside the column on wide screens. */
  .side { position: fixed; top: 0; bottom: 0; width: calc((100% - 30rem) / 2); z-index: 6; pointer-events: none; overflow: hidden; }
  .side.left { left: 0; }
  .side.right { right: 0; }
  @media (max-width: 48rem) { .side { display: none; } }
  .hang {
    position: absolute;
    top: 0;
    left: var(--x);
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: top center;
    animation: sway 4.5s ease-in-out var(--d) infinite alternate;
  }
  .hang::before, .hang .seg { content: ""; display: block; width: 2px; background: var(--glass-line); }
  .hang::before { height: var(--len); }
  .hang .seg { height: 1.4rem; }
  .hang .icon { width: var(--s); height: var(--s); margin-top: -3px; filter: drop-shadow(0 3px 0 rgba(194, 62, 110, 0.15)); }
  @keyframes sway {
    from { transform: rotate(-5deg); }
    to { transform: rotate(5deg); }
  }
  .cloud {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    aspect-ratio: 3 / 1;
    background: var(--card);
    border-radius: 999px;
    box-shadow: 0 5px 0 var(--dots);
    animation: bob 8s ease-in-out var(--d) infinite alternate;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: var(--card); border-radius: 50%; aspect-ratio: 1; }
  .cloud::before { width: 46%; left: 14%; bottom: 35%; }
  .cloud::after { width: 34%; right: 16%; bottom: 40%; }
  .cloud .face { position: absolute; z-index: 1; left: 50%; top: 38%; width: 34%; transform: translateX(-50%); }
  @keyframes bob {
    from { transform: translateX(-10px); }
    to { transform: translateX(10px); }
  }
  .rainbow { position: absolute; left: 8%; top: 70%; width: min(70%, 11rem); height: auto; }
  .rainbow path { fill: none; stroke-width: 9; stroke-linecap: round; }
  .big-star { position: absolute; left: 58%; top: 78%; width: 4.5rem; height: 4.5rem; color: var(--p1); transform: rotate(14deg); filter: drop-shadow(0 4px 0 rgba(194, 62, 110, 0.15)); animation: twinkle 3.2s ease-in-out infinite; }

  .balloons { position: absolute; left: var(--x); top: var(--y); width: 5rem; height: auto; animation: rise 6s ease-in-out var(--d) infinite alternate; }
  .balloons .str { fill: none; stroke: var(--glass-line); stroke-width: 1.5; }
  @keyframes rise {
    from { transform: translateY(0) rotate(-3deg); }
    to { transform: translateY(-18px) rotate(3deg); }
  }
  .meadow { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); height: 5.5rem; }
  .hill { position: absolute; left: -15%; right: -15%; bottom: -2.5rem; height: 5rem; background: var(--grass); border-radius: 50% 50% 0 0; }
  .flower { position: absolute; bottom: 1.6rem; left: var(--x); width: var(--s); height: calc(var(--s) * 34 / 24); color: var(--c); transform-origin: bottom center; animation: sway 3.5s ease-in-out var(--d) infinite alternate; }

  .cat { position: absolute; z-index: 2; width: 4rem; height: auto; bottom: 1.9rem; left: calc(50% + min(32vw, 7.75rem) - 2.8rem); pointer-events: none; }
  .cat .fur { fill: var(--card); stroke: var(--pink-soft); stroke-width: 2; }
  .cat .inner { fill: var(--pink-soft); }
  .cat .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
  .cat .nose { fill: var(--pink); }
  .cat .blush { fill: var(--blush); opacity: 0.7; }
  .cat .tail { fill: none; stroke: var(--card); stroke-width: 6; stroke-linecap: round; }
  .cat .tail-edge { fill: none; stroke: var(--pink-soft); stroke-width: 9; stroke-linecap: round; }

  .sticker { position: absolute; top: -0.9rem; right: 0.9rem; width: 2.2rem; height: 2.2rem; color: var(--p2); transform: rotate(14deg); filter: drop-shadow(0 0 0 var(--card)) drop-shadow(2px 2px 0 var(--card)) drop-shadow(-2px -2px 0 var(--card)) drop-shadow(0 3px 0 rgba(194, 62, 110, 0.2)); }

  .tap-bit {
    position: fixed;
    z-index: 20;
    left: var(--px);
    top: var(--py);
    width: var(--s);
    height: var(--s);
    margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    color: var(--c);
    pointer-events: none;
    animation: float-up 0.9s ease-out forwards;
  }
  @keyframes float-up {
    from { transform: translate(0, 0) scale(0.4); opacity: 1; }
    to { transform: translate(var(--dx), -60px) scale(1); opacity: 0; }
  }

  .fall { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .fall .icon {
    position: absolute;
    top: -2rem;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    color: var(--c);
    opacity: 0.55;
    animation: fall var(--t) linear var(--d) infinite;
  }
  @keyframes fall {
    from { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(28px, 52vh) rotate(180deg); }
    to { transform: translate(-12px, calc(100vh + 4rem)) rotate(360deg); }
  }

  .jar-svg .tag-string { fill: none; stroke: var(--pink); stroke-width: 1.5; }
  .jar-svg .tag { fill: var(--card); stroke: var(--pink); stroke-width: 2; }
  .jar-svg .tag-hole { fill: var(--pink-soft); }
  .jar-svg .tag-text { font-family: var(--font-display); font-size: 12.5px; fill: var(--pink-deep); }

  .note::after {
    content: "";
    position: absolute;
    left: 1.25rem;
    right: 1.25rem;
    bottom: -1rem;
    height: 0.6rem;
    background: radial-gradient(circle at 50% 0, var(--c, var(--pink-soft)) 0.3rem, transparent 0.32rem);
    background-size: 0.9rem 0.6rem;
  }

  .eyebrow { display: inline-flex; align-items: center; gap: 0.35rem; }
  .eyebrow .icon { width: 0.8rem; height: 0.8rem; color: var(--pink); }
  .btn-star { width: 1.15rem; height: 1.15rem; color: var(--p1); flex: none; }

  .bunny { position: absolute; bottom: 1.6rem; left: 64%; width: 3.4rem; height: auto; }
  .bunny .fur { fill: var(--card); stroke: var(--pink-soft); stroke-width: 2; }
  .bunny .inner { fill: var(--pink-soft); }
  .bunny .eye { fill: var(--ink); }
  .bunny .blush { fill: var(--blush); opacity: 0.7; }
  .bunny .nose { fill: var(--pink); }
  .flit { position: absolute; left: var(--x); top: var(--y); animation: flit 10s ease-in-out var(--d) infinite; }
  .flit .icon { width: var(--s); height: var(--s); color: var(--c); animation: flap 0.28s ease-in-out infinite alternate; }
  @keyframes flit {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(40px, -30px); }
    50% { transform: translate(10px, -60px); }
    75% { transform: translate(-30px, -20px); }
  }
  @keyframes flap {
    from { transform: scaleX(1); }
    to { transform: scaleX(0.35); }
  }

  .sign-row { display: flex; align-items: center; gap: 0.4rem; }
  .sign-row .icon { width: 1.1rem; height: 1.1rem; color: var(--pink); }

  @media (prefers-reduced-motion: reduce) {
    .note.pop, .jar.wiggle .jar-inner { animation: none; }
    .dock .btn { transition: none; }
    .sky .icon, .tw, .jar-sparkle, .hang, .cloud, .big-star, .balloons, .flower, .flit, .flit .icon, .note .note-star { animation: none; }
    .fall { display: none; }
  }
</style>

    "หนูเป็นคนที่พี่เชื่อใจที่สุดคนหนึ่งเลยนะ",
    "หนูคือดอกไม้ที่สวยงามที่สุดในสวนของพี่",
    "หนูเก่งพอแล้ว ตั้งแต่วันแรกจนถึงวันนี้",
    "ทุกครั้งที่หนูล้ม พี่เห็นว่าหนูลุกขึ้นมาได้เสมอ",
    "พี่ยังเชียร์หนูอยู่ตรงนี้ ไม่ไปไหนแน่นอน",
    "เก็บดาวดวงนี้ไว้ในใจนะ เวลาท้อจะได้นึกถึง",
    "สู้ ๆ นะ น้อง Chertam พี่เป็นกำลังใจให้เสมอ"
  ];
  const TOTAL = MESSAGES.length;
  const COLORS = ["--p1", "--p2", "--p3", "--p4", "--p5", "--p6"];
  const STORE_KEY = "chertam-stars-random";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Decorative pile in jar SVG units (200 x 260): [row center y, stars in row], bottom first.
  function luckyStar(face) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "icon star");
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#lucky-" + face);
    svg.appendChild(use);
    return svg;
  }

  const ROWS = [[228, 5], [203, 4], [178, 5], [153, 4], [128, 5], [103, 4]];
  const pile = document.getElementById("pile");
  let n = 0;
  ROWS.forEach(([y, count]) => {
    const start = count === 5 ? 40 : 55;
    for (let k = 0; k < count; k++, n++) {
      const s = luckyStar(["a", "b", "c", "d", "e"][n % 5]);
      s.style.left = ((start + k * 30 + (n * 37) % 9 - 4 - 17) / 200 * 100) + "%";
      s.style.top = ((y - 17) / 260 * 100) + "%";
      s.style.setProperty("--rot", ((n * 47) % 70 - 35) + "deg");
      s.style.setProperty("--c", `var(${COLORS[n % COLORS.length]})`);
      pile.appendChild(s);
    }
  });

  // Shuffle-bag: every message shows once before any repeats; remembered per device.
  let seen = [];
  let last = -1;
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && Array.isArray(saved.seen)) seen = saved.seen.filter(i => Number.isInteger(i) && i >= 0 && i < TOTAL);
    if (saved && Number.isInteger(saved.last) && saved.last < TOTAL) last = saved.last;
  } catch (e) {}

  const note = document.getElementById("note");
  const jar = document.getElementById("jar");

  function render(i) {
    const color = `var(${COLORS[Math.floor(Math.random() * COLORS.length)]})`;
    note.style.setProperty("--c", color);
    const noteStar = document.getElementById("note-star");
    noteStar.style.setProperty("--c", color);
    noteStar.querySelector("use").setAttribute("href", "#lucky-" + ["a", "b", "c", "d", "e"][i % 5]);
    document.getElementById("note-text").textContent = MESSAGES[i];
  }

  const SVG_NS = "http://www.w3.org/2000/svg";
  function icon(name) {
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "icon");
    const use = document.createElementNS(SVG_NS, "use");
    use.setAttribute("href", "#" + name);
    svg.appendChild(use);
    return svg;
  }

  // Hanging strings of stars and hearts on each side: [side, x, string length, delay, icons].
  const HANGERS = [
    ["left", 18, "14vh", 0, [["lucky-a", "--p1"], ["heart", "--p2"]]],
    ["left", 48, "28vh", -1.5, [["sparkle", "--p4"]]],
    ["left", 76, "8vh", -3, [["heart", "--p3"], ["lucky-b", "--p5"], ["heart", "--p2"]]],
    ["right", 24, "22vh", -0.8, [["heart", "--p2"], ["lucky-b", "--p6"]]],
    ["right", 54, "9vh", -2.2, [["lucky-b", "--p1"]]],
    ["right", 82, "30vh", -3.6, [["heart", "--p4"], ["sparkle", "--p1"]]]
  ];
  HANGERS.forEach(([side, x, len, delay, items]) => {
    const h = document.createElement("div");
    h.className = "hang";
    h.style.setProperty("--x", x + "%");
    h.style.setProperty("--len", len);
    h.style.setProperty("--d", delay + "s");
    items.forEach(([name, color], k) => {
      if (k) { const seg = document.createElement("span"); seg.className = "seg"; h.appendChild(seg); }
      const el = icon(name);
      el.style.setProperty("--s", (name === "sparkle" ? 2 : 2.4) + "rem");
      el.style.color = `var(${color})`;
      h.appendChild(el);
    });
    document.getElementById("side-" + side).appendChild(h);
  });

  // Flowers along the hill at the bottom of each side.
  document.querySelectorAll("[data-meadow]").forEach((m, side) => {
    for (let k = 0; k < 7; k++) {
      const f = icon("flower");
      f.classList.add("flower");
      f.style.setProperty("--x", (4 + k * 14 + ((k * 13 + side * 7) % 6)) + "%");
      f.style.setProperty("--s", (1.3 + ((k * 7 + side * 3) % 5) * 0.2) + "rem");
      f.style.setProperty("--c", `var(${["--p2", "--p4", "--p5", "--p6", "--p3"][(k + side * 2) % 5]})`);
      f.style.setProperty("--d", (-k * 0.6) + "s");
      m.appendChild(f);
    }
  });

  // Little hearts wherever you tap.
  document.addEventListener("pointerdown", e => {
    if (reduceMotion) return;
    for (let k = 0; k < 3; k++) {
      const el = icon(k === 1 ? "sparkle" : "heart");
      el.classList.add("tap-bit");
      el.style.setProperty("--px", e.clientX + "px");
      el.style.setProperty("--py", e.clientY + "px");
      el.style.setProperty("--dx", (k - 1) * 22 + "px");
      el.style.setProperty("--s", (0.8 + Math.random() * 0.5) + "rem");
      el.style.setProperty("--c", `var(${COLORS[Math.floor(Math.random() * COLORS.length)]})`);
      el.addEventListener("animationend", () => el.remove());
      document.body.appendChild(el);
    }
  });

  // Petals and tiny hearts drifting down the whole screen.
  const fall = document.getElementById("fall");
  for (let k = 0; k < 14; k++) {
    const el = icon(k % 3 === 2 ? "heart" : "petal");
    el.style.setProperty("--x", ((k * 37 + 5) % 100) + "%");
    el.style.setProperty("--s", (0.6 + (k % 4) * 0.15) + "rem");
    el.style.setProperty("--t", (11 + (k % 5) * 2) + "s");
    el.style.setProperty("--d", (-k * 1.3) + "s");
    el.style.setProperty("--c", `var(${k % 3 === 2 ? "--p4" : "--p2"})`);
    fall.appendChild(el);
  }

  // Floating hearts and sparkles, kept near the side edges so they stay clear of the text.
  const SKY = [
    ["heart", 3, 8, 1.1], ["sparkle", 90, 5, 1.0], ["star5", 92, 22, 0.9], ["heart", 6, 30, 0.8],
    ["sparkle", 4, 52, 1.1], ["heart", 91, 44, 1.2], ["star5", 7, 74, 1.0], ["sparkle", 93, 66, 0.8],
    ["heart", 89, 86, 1.0], ["sparkle", 5, 92, 0.9]
  ];
  const sky = document.getElementById("sky");
  SKY.forEach(([name, x, y, size], k) => {
    const el = icon(name);
    el.style.setProperty("--x", x + "%");
    el.style.setProperty("--y", y + "%");
    el.style.setProperty("--s", size + "rem");
    el.style.setProperty("--d", (-k * 0.9) + "s");
    el.style.setProperty("--c", `var(${COLORS[k % COLORS.length]})`);
    sky.appendChild(el);
  });

  function burst() {
    for (let k = 0; k < 12; k++) {
      const el = icon(k % 3 === 0 ? "sparkle" : k % 3 === 1 ? "heart" : "star5");
      el.classList.add("bit");
      const angle = (Math.PI * 2 * k) / 12 + Math.random() * 0.4;
      const dist = 70 + Math.random() * 50;
      el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      el.style.setProperty("--dy", Math.sin(angle) * dist - 20 + "px");
      el.style.setProperty("--r", (Math.random() * 120 - 60) + "deg");
      el.style.setProperty("--s", (0.7 + Math.random() * 0.6) + "rem");
      el.style.setProperty("--c", `var(${COLORS[k % COLORS.length]})`);
      el.addEventListener("animationend", () => el.remove());
      note.appendChild(el);
    }
  }

  function draw() {
    let pool = MESSAGES.map((_, i) => i).filter(i => !seen.includes(i));
    if (!pool.length) { seen = []; pool = MESSAGES.map((_, i) => i).filter(i => i !== last); }
    const i = pool[Math.floor(Math.random() * pool.length)];
    seen.push(i);
    last = i;
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ seen, last })); } catch (e) {}
    render(i);
    if (!reduceMotion) {
      note.classList.remove("pop");
      jar.classList.remove("wiggle");
      void note.offsetWidth;
      note.classList.add("pop");
      jar.classList.add("wiggle");
      burst();
    }
  }

  jar.addEventListener("click", draw);
  document.getElementById("draw").addEventListener("click", draw);
  if (last >= 0) render(last);
</script>

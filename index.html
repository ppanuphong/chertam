<style>
  /* Layout: one phone-width column (jar with a little face, the note it gives you) and a candy button pinned to the bottom for the thumb.
     Single pastel theme on purpose: the page keeps its sweet look in light and dark system settings. */
  :root {
    --bg: #FFF1F5;
    --dots: #FFDCE6;
    --card: #FFFFFF;
    --ink: #5B3A4B;
    --muted: #8F6A7C;
    --pink: #E8578A;
    --pink-deep: #C23E6E;
    --pink-soft: #FFB8CC;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-line: #F4A9BE;
    --blush: #FF9DB8;
    --p1: #FFD66B;
    --p2: #FF9EBB;
    --p3: #8EDCC0;
    --p4: #BBA8F5;
    --p5: #FFB27A;
    --p6: #8CCBFF;
    --font-display: "Itim", "Mali", "Comic Sans MS", cursive;
    --font-body: "Mali", "Thonburi", "Leelawadee UI", system-ui, sans-serif;
    color-scheme: light;
  }

  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(var(--dots) 18%, transparent 19%),
      radial-gradient(var(--dots) 18%, transparent 19%);
    background-size: 2.4rem 2.4rem;
    background-position: 0 0, 1.2rem 1.2rem;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.7;
    -webkit-tap-highlight-color: transparent;
  }
  .page {
    max-width: 28rem;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 1.75rem calc(6.5rem + env(safe-area-inset-bottom, 0px));
    display: grid;
    gap: 1.5rem;
  }

  header { display: grid; justify-items: center; gap: 0.5rem; text-align: center; }
  .eyebrow {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--pink-deep);
    background: var(--card);
    border: 2px solid var(--pink-soft);
    border-radius: 999px;
    padding: 0.15rem 0.9rem;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.1rem, 10vw, 2.9rem);
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }
  h1 .name { color: var(--pink); }
  .lead { margin: 0; color: var(--muted); max-width: 22rem; }

  /* Jar */
  .jar-area { display: grid; justify-items: center; }
  .jar {
    position: relative;
    width: min(64vw, 15.5rem);
    max-width: 100%;
    aspect-ratio: 200 / 260;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    border-radius: 2rem;
    touch-action: manipulation;
  }
  .jar:focus-visible { outline: 3px dashed var(--pink); outline-offset: 6px; }
  .jar-inner { position: absolute; inset: 0; transform-origin: 50% 90%; }
  .jar.wiggle .jar-inner { animation: wiggle 0.5s ease; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-6deg); }
    50% { transform: rotate(5deg); }
    75% { transform: rotate(-2deg); }
  }
  .jar-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .jar-svg .glass { fill: var(--glass); stroke: var(--glass-line); stroke-width: 3; }
  .jar-svg .shine { fill: none; stroke: var(--card); stroke-width: 6; stroke-linecap: round; }
  .jar-svg .lid { fill: var(--pink-soft); stroke: var(--pink); stroke-width: 2.5; }
  .jar-svg .lid-dot { fill: var(--card); opacity: 0.8; }
  .jar-svg .eye { fill: var(--ink); }
  .jar-svg .smile { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
  .jar-svg .blush { fill: var(--blush); opacity: 0.7; }
  .jar-svg .bow { fill: var(--pink); }
  .pile { position: absolute; inset: 0; }
  .pile .star { position: absolute; width: 17%; height: auto; aspect-ratio: 1; transform: rotate(var(--rot)); }
  .jar-hint { margin-top: 0.4rem; font-size: 0.9rem; color: var(--muted); }

  .star {
    display: block;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.65), transparent 45%),
      var(--c);
    clip-path: polygon(50% 2%, 62% 36%, 98% 37%, 69% 59%, 80% 95%, 50% 74%, 20% 95%, 31% 59%, 2% 37%, 38% 36%);
  }

  /* Note */
  .note {
    position: relative;
    background: var(--card);
    border: 3px solid var(--c, var(--pink-soft));
    border-radius: 1.5rem;
    padding: 2rem 1.4rem 1.5rem;
    min-height: 10rem;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 0.6rem;
    text-align: center;
    box-shadow: 0 6px 0 var(--c, var(--pink-soft));
  }
  .note::before {
    content: "";
    position: absolute;
    top: -0.85rem;
    left: 50%;
    width: 5.5rem;
    height: 1.5rem;
    transform: translateX(-50%) rotate(-3deg);
    background: repeating-linear-gradient(45deg, var(--pink-soft) 0 6px, var(--dots) 6px 12px);
    opacity: 0.9;
    border-radius: 3px;
  }
  .note .note-star { width: 2.4rem; height: 2.4rem; }
  .note.pop { animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop {
    from { transform: translateY(-2.5rem) scale(0.4) rotate(-8deg); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .note-text {
    font-family: var(--font-display);
    font-size: clamp(1.3rem, 5.8vw, 1.55rem);
    line-height: 1.55;
    margin: 0;
    text-wrap: pretty;
  }

  footer { display: grid; justify-items: center; gap: 0.1rem; text-align: center; color: var(--muted); }
  footer .sign { font-family: var(--font-display); font-size: 1.3rem; color: var(--pink-deep); }

  /* Thumb dock */
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0.75rem calc(0.9rem + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .dock .btn {
    display: block;
    width: 100%;
    max-width: 24rem;
    margin: 0 auto;
    font: 700 1.2rem/1 var(--font-body);
    min-height: 3.4rem;
    border-radius: 999px;
    border: 0;
    background: var(--pink);
    color: #FFFFFF;
    box-shadow: 0 5px 0 var(--pink-deep);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .dock .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-deep); }
  .dock .btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .note.pop, .jar.wiggle .jar-inner { animation: none; }
    .dock .btn { transition: none; }
  }
</style>

<div class="page">

  <section class="note" id="note" aria-live="polite">

  </section>

  <footer>

  </footer>
</div>

    "วันนี้ลองทำสิ่งที่หนูชอบสักอย่างนะ",
    "มีคนรักหนูมากกว่าที่หนูรู้ตั้งเยอะ",
    "วันนี้ขอให้หนูได้กินของอร่อย ๆ นะ",
    "หนูเก่งเสมอ ไม่ว่าจะเจอเรื่องยากแค่ไหน",
    "หนูไม่ต้องแบกทุกอย่างไว้คนเดียว",
    "ทุกความพยายามเล็ก ๆ ของหนู พี่ภูมิใจทั้งหมดเลย",
    "ชีวิตไม่ได้ต้องการความสมบูรณ์แบบ แค่มีความสุขก็พอแล้ว",
    "ถ้ายังไม่พร้อม รออีกนิดก็ได้",
    "หนูคุ้มค่ากับการรอเสมอ",
    "หัวใจของหนูสวยงามมาก",
    "หนูเป็นคนที่พี่ไว้ใจที่สุดคนหนึ่งเลยนะ",
    "พักสายตาจากจอสักหน่อย มองฟ้าไกล ๆ บ้างนะ",
    "หนูเก่งพอแล้ว ตั้งแต่วันแรกจนถึงวันนี้",
    "ทุกครั้งที่หนูล้ม พี่เห็นว่าหนูลุกขึ้นมาได้เสมอ",
    "พี่ยังเชียร์หนูอยู่ตรงนี้ ไม่ไปไหนแน่นอน",
    "เก็บดาวดวงนี้ไว้ในใจนะ เวลาท้อจะได้นึกถึง",
    "สู้ ๆ นะ น้อง Chertam พี่เป็นกำลังใจให้เสมอ"
  ];
  const TOTAL = MESSAGES.length;
  const COLORS = ["--p1", "--p2", "--p3", "--p4", "--p5", "--p6"];
  const STORE_KEY = "chertam-stars-random";
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Decorative pile in jar SVG units (200 x 260): [row center y, stars in row], bottom first.
  const ROWS = [[228, 5], [203, 4], [178, 5], [153, 4], [128, 5], [103, 4]];
  const pile = document.getElementById("pile");
  let n = 0;
  ROWS.forEach(([y, count]) => {
    const start = count === 5 ? 40 : 55;
    for (let k = 0; k < count; k++, n++) {
      const s = document.createElement("span");
      s.className = "star";
      s.style.left = ((start + k * 30 + (n * 37) % 9 - 4 - 17) / 200 * 100) + "%";
      s.style.top = ((y - 17) / 260 * 100) + "%";
      s.style.setProperty("--rot", ((n * 47) % 70 - 35) + "deg");
      s.style.setProperty("--c", `var(${COLORS[n % COLORS.length]})`);
      pile.appendChild(s);
    }
  });

  // Shuffle-bag: every message shows once before any repeats; remembered per device.
  let seen = [];
  let last = -1;
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && Array.isArray(saved.seen)) seen = saved.seen.filter(i => Number.isInteger(i) && i >= 0 && i < TOTAL);
    if (saved && Number.isInteger(saved.last) && saved.last < TOTAL) last = saved.last;
  } catch (e) {}

  const note = document.getElementById("note");
  const jar = document.getElementById("jar");

  function render(i) {
    const color = `var(${COLORS[Math.floor(Math.random() * COLORS.length)]})`;
    note.style.setProperty("--c", color);
    document.getElementById("note-star").style.setProperty("--c", color);
    document.getElementById("note-text").textContent = MESSAGES[i];
  }

  function draw() {
    let pool = MESSAGES.map((_, i) => i).filter(i => !seen.includes(i));
    if (!pool.length) { seen = []; pool = MESSAGES.map((_, i) => i).filter(i => i !== last); }
    const i = pool[Math.floor(Math.random() * pool.length)];
    seen.push(i);
    last = i;
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ seen, last })); } catch (e) {}
    render(i);
    if (!reduceMotion) {
      note.classList.remove("pop");
      jar.classList.remove("wiggle");
      void note.offsetWidth;
      note.classList.add("pop");
      jar.classList.add("wiggle");
    }
  }

  jar.addEventListener("click", draw);
  document.getElementById("draw").addEventListener("click", draw);
  if (last >= 0) render(last);
</script>
